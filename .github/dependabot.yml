version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    # React and React Native are pinned to the versions the Expo SDK expects, and
    # react-test-renderer must match react exactly. Their minor and major versions move only
    # during an SDK upgrade (`npx expo install --fix`, then the renderer by hand); grouping
    # alone would still open a PR for whichever of them has a release.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@types/react-test-renderer"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # A new Expo SDK is a major version of every Expo package plus a React Native bump, and
      # needs `npx expo install --fix`; Dependabot can only bump packages one by one, which
      # leaves the app on mixed SDKs. SDK upgrades are done by hand.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
    groups:
      # Expo packages within one SDK release together, so their minor and patch updates
      # land as one PR. React's patch releases ship in lockstep and are grouped here too.
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react"
          - "react-dom"
          - "react-native"
          - "react-test-renderer"
          - "@types/react"
          - "@types/react-test-renderer"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-patches:
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "13:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
