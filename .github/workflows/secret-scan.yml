name: Secret scan

# No paths filter: a key pasted into a doc or image alt text is as public as one in code.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scans the checked-out tree with .gitleaks.toml and .gitleaksignore.
      - name: Scan for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          dir . --no-banner --redact --config .gitleaks.toml
