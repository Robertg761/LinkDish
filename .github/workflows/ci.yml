name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "store-shots/**"
      - "**.md"
      - "*.png"
      - privacy.html
      - support.html
  pull_request:
    paths-ignore:
      - "docs/**"
      - "store-shots/**"
      - "**.md"
      - "*.png"
      - privacy.html
      - support.html

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
