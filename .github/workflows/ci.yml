name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "store-shots/**"
      - "**.md"
      - "*.png"
      - privacy.html
      - support.html
  pull_request:
    paths-ignore:
      - "docs/**"
      - "store-shots/**"
      - "**.md"
      - "*.png"
      - privacy.html
      - support.html

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
