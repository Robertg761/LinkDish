name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "store-shots/**"
      - "**.md"
      - "*.png"
      - privacy.html
      - support.html
  pull_request:
    paths-ignore:
      - "docs/**"
      - "store-shots/**"
      - "**.md"
      - "*.png"
      - privacy.html
      - support.html

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
