name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "store-shots/**"
      - "**.md"
      - "*.png"
      - privacy.html
      - support.html
  pull_request:
    paths-ignore:
      - "docs/**"
      - "store-shots/**"
      - "**.md"
      - "*.png"
      - privacy.html
      - support.html

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.8.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
