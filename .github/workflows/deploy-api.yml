name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - api/**
      - services/extractor-api/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - vercel.json
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.8.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm validate

      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel output
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy API to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Verify production API
        run: pnpm release:api:production

      - name: Run production canary
        env:
          LINKDISH_CANARY_BASE_URL: https://api.linkdish.ca
          LINKDISH_CANARY_AUTH_TOKEN: ${{ secrets.LINKDISH_CANARY_AUTH_TOKEN }}
        run: pnpm canary:live
