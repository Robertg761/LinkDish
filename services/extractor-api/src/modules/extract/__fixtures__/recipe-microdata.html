<!doctype html>
<html>
  <head>
    <title>Creamy Mushroom Orzo</title>
  </head>
  <body>
    <article itemscope itemtype="https://schema.org/Recipe">
      <h1 itemprop="name">Creamy Mushroom Orzo</h1>
      <p itemprop="recipeYield">2 servings</p>
      <meta itemprop="prepTime" content="PT5M" />
      <meta itemprop="cookTime" content="PT18M" />
      <ul>
        <li itemprop="recipeIngredient">1 cup orzo</li>
        <li itemprop="recipeIngredient">8 oz mushrooms</li>
        <li itemprop="recipeIngredient">2 cups stock</li>
      </ul>
      <ol>
        <li itemprop="recipeInstructions">Saute the mushrooms until golden.</li>
        <li itemprop="recipeInstructions">Toast the orzo and add the stock.</li>
        <li itemprop="recipeInstructions">Simmer until creamy and serve.</li>
      </ol>
    </article>
  </body>
</html>
